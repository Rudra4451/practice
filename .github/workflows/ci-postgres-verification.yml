name: PostgreSQL 16 Migration Verification

permissions:
  contents: read

on:
  push:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/reference/**'
      - 'tests/db/**'
      - 'docker-compose.db.yml'
      - '.github/workflows/ci-postgres-verification.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/reference/**'
      - 'tests/db/**'
      - 'docker-compose.db.yml'
      - '.github/workflows/ci-postgres-verification.yml'
  workflow_dispatch:

concurrency:
  group: postgres-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-postgres-16:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: typrox_ci_pg_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=5s

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install postgresql-client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify line endings and migration directory hygiene
        run: |
          if grep -nU $'\r' \
            tests/db/run-pg-verification.sh \
            tests/db/supabase_shim.sql \
            tests/db/verify_migrations.sql \
            docker-compose.db.yml \
            .github/workflows/ci-postgres-verification.yml \
            supabase/migrations/2026062*.sql; then
            echo "ERROR: Unexpected CRLF line endings detected in DB verification or candidate migration files." >&2
            exit 1
          fi
          for f in supabase/migrations/*; do
            base=$(basename "$f")
            case "$base" in
              [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_*.sql) ;;
              *)
                echo "ERROR: Invalid non-timestamped file in supabase/migrations/: $base" >&2
                exit 1
                ;;
            esac
          done

      - name: Verify sequential migrations, FULL_SCHEMA upgrade, idempotency, security & concurrency on PostgreSQL 16
        id: pg_verify
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: typrox_ci_pg_password
        run: sh tests/db/run-pg-verification.sh

      - name: Cleanup leftover ephemeral verification databases
        if: always()
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: typrox_ci_pg_password
        run: |
          if command -v psql >/dev/null 2>&1 && pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres >/dev/null 2>&1; then
            psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -q -t -A -c \
              "SELECT 'DROP DATABASE IF EXISTS ' || quote_ident(datname) || ' WITH (FORCE);' FROM pg_database WHERE datname LIKE 'typrox_verify_%';" \
              | psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -v ON_ERROR_STOP=1 >/dev/null 2>&1 || true
          fi

      - name: Write verification summary
        if: always()
        run: |
          {
            echo "### PostgreSQL 16 Migration Verification"
            echo "- Outcome: **${{ steps.pg_verify.outcome }}**"
            echo "- Migrations verified: \`20260618\` -> \`20260619\` -> \`20260620\` -> \`20260621\` (consolidated hardening + atomic persistence) -> \`20260622\`"
            echo "- Scenarios covered: Clean Bootstrap + 2-Worker Contention Barrier; \`FULL_SCHEMA.sql\` Baseline Upgrade + Historical Outlier Quarantine + Unknown Function Revocation; Index/Constraint Drift Reconciliation + Double-Rerun Idempotency."
          } >> "$GITHUB_STEP_SUMMARY"
