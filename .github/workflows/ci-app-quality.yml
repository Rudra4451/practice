name: Application Quality, Builds & E2E

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: app-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-ci-anon-key-not-a-real-secret
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3105

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify workflow line endings
        run: |
          if grep -nU $'\r' .github/workflows/ci-app-quality.yml; then
            echo "ERROR: Unexpected CRLF line endings detected in .github/workflows/ci-app-quality.yml." >&2
            exit 1
          fi

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest unit & route tests
        run: npm run test:unit

      - name: Build Next.js bundle (Webpack parity)
        run: npx next build --webpack

      - name: Build Next.js bundle (Default Turbopack)
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npx playwright install chromium
          if node -e "const { chromium } = require('@playwright/test'); chromium.launch().then((b) => b.close()).catch((err) => { console.error(err.message); process.exit(1); });"; then
            echo "Playwright Chromium launched with preinstalled OS libraries; skipping apt install-deps."
          else
            echo "Chromium launch failed; installing OS dependencies via playwright install-deps..."
            npx playwright install-deps chromium
          fi

      - name: Run Playwright end-to-end tests
        run: npm run test:e2e

